<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CAPMIX // Workstation & Subtractive Mixer</title>
  <style>
    :root {
      --bg: #0d0e11;
      --panel: #14161b;
      --panel-border: #22252c;
      --text: #f4f4f5;
      --text-muted: #8b8f9a;
      --accent: #e11d48;
      --accent-hover: #f43f5e;
      --success: #10b981;
      --cap-plastic: rgba(255, 255, 255, 0.08);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Utility Bar */
    .header {
      height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand span {
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      border: 1px solid var(--accent);
      padding: 1px 4px;
      border-radius: 3px;
    }

    .status-pill {
      font-size: 11px;
      color: var(--success);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    /* Viewport Area */
    .viewport {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* View Tab Content Containers */
    .tab-view {
      display: none;
      width: 100%;
      height: 100%;
    }

    .tab-view.active {
      display: flex;
    }

    /* --- MIXER SANDBOX LAYOUT --- */
    .mixer-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, #1b1e26 0%, #0d0e11 75%);
      padding: 20px;
    }

    /* Meniscus Ink Cap Graphic */
    .cap-container {
      position: relative;
      width: 190px;
      height: 190px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cap-lip {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 58%, rgba(255,255,255,0.12) 65%, rgba(0,0,0,0.85) 98%);
      border: 2px solid rgba(255,255,255,0.22);
      box-shadow: 0 16px 32px rgba(0,0,0,0.7), inset 0 2px 4px rgba(255,255,255,0.4);
      pointer-events: none;
    }

    .cap-liquid {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      box-shadow: inset 0 8px 18px rgba(0,0,0,0.8), inset 0 -4px 10px rgba(255,255,255,0.15);
      transition: background-color 0.15s ease-out;
      position: relative;
      overflow: hidden;
    }

    .cap-reflection {
      position: absolute;
      top: 10%;
      left: 14%;
      width: 38%;
      height: 22%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 100%);
      transform: rotate(-25deg);
      pointer-events: none;
    }

    .cap-meta {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }

    .meta-tag {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 11px;
      font-family: var(--font-mono);
      text-align: center;
    }

    .meta-tag span {
      display: block;
      color: var(--text-muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    /* Mixer Right Panel */
    .mixer-right {
      width: 380px;
      background: var(--panel);
      border-left: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 14px;
      overflow-y: auto;
    }

    .panel-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 700;
    }

    .ink-slider-card {
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ink-slider-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ink-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ink-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .ink-name {
      font-size: 12px;
      font-weight: 600;
    }

    .drop-count {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-muted);
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .actions-grid {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      background: var(--panel-border);
      border: 1px solid transparent;
      color: var(--text);
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:active {
      transform: scale(0.99);
    }

    .btn-primary {
      background: var(--accent);
    }
    .btn-primary:active {
      background: var(--accent-hover);
    }

    /* --- RECIPES & INVENTORY ARCHITECTURE --- */
    .full-view-panel {
      flex: 1;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
      overflow-y: auto;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .recipe-card {
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .recipe-head {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .recipe-swatch {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: #27272a;
      color: var(--text-muted);
      align-self: flex-start;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    .badge-proven {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      height: 58px;
      background: #09090b;
      border-top: 1px solid var(--panel-border);
      display: flex;
    }

    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      background: none;
      border: none;
      gap: 4px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: var(--accent);
    }

    .nav-icon {
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Top System Bar -->
  <header class="header">
    <div class="brand">CAPMIX <span>ENGINE v1.0</span></div>
    <div class="status-pill">OFFLINE ARCHIVE READY</div>
  </header>

  <!-- Viewport Hub -->
  <main class="viewport">

    <!-- TAB 1: MIXING SANDBOX -->
    <section id="view-mixer" class="tab-view active">
      <div class="mixer-left">
        <div class="cap-container">
          <div class="cap-lip"></div>
          <div id="liquid-cap" class="cap-liquid">
            <div class="cap-reflection"></div>
          </div>
        </div>
        <div class="cap-meta">
          <div class="meta-tag"><span>Total Batch</span><b id="meta-drops">≈ 20 Drops</b></div>
          <div class="meta-tag"><span>Simulated Hex</span><b id="meta-hex">#000000</b></div>
          <div class="meta-tag"><span>Cap Size</span><b>15mm Standard</b></div>
        </div>
      </div>

      <div class="mixer-right">
        <div class="panel-title">Active Ingredients (Concentrate)</div>
        <div id="sliders-target" style="display: flex; flex-direction: column; gap: 8px;"></div>
        
        <div class="actions-grid">
          <button class="btn btn-primary" onclick="saveActiveRecipe()">Save to Recipe Library</button>
          <button class="btn" onclick="resetDefaults()">Reset Sandbox Ratios</button>
        </div>
      </div>
    </section>

    <!-- TAB 2: RECIPES ARCHIVE -->
    <section id="view-recipes" class="tab-view">
      <div class="full-view-panel">
        <div class="panel-title">Saved Master Recipes (Local IndexedDB)</div>
        <div id="recipes-list" class="card-list"></div>
      </div>
    </section>

    <!-- TAB 3: INVENTORY TRACKER -->
    <section id="view-inventory" class="tab-view">
      <div class="full-view-panel">
        <div class="panel-title">Physical Stock Registry</div>
        <div id="inventory-list" class="card-list"></div>
      </div>
    </section>

  </main>

  <!-- Bottom Workstation Dock -->
  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="switchTab('view-mixer', this)">
      <div class="nav-icon">🧪</div>
      <span>Mixer</span>
    </button>
    <button class="nav-btn" onclick="switchTab('view-recipes', this)">
      <div class="nav-icon">📖</div>
      <span>Recipes</span>
    </button>
    <button class="nav-btn" onclick="switchTab('view-inventory', this)">
      <div class="nav-icon">🗄️</div>
      <span>Inventory</span>
    </button>
  </nav>

  <script>
    /* =========================================================================
       1. DATA ENGINE: STOCK INVENTORY & PRESET RECIPES
       ========================================================================= */
    const DEFAULT_STOCK = [
      { id: 'ink_1', brand: 'Eternal', name: 'Deep Burgundy', hex: '#581825', k: 0.85, s: 0.15, owned: true },
      { id: 'ink_2', brand: 'World Famous', name: 'Pure White', hex: '#f8fafc', k: 0.02, s: 0.98, owned: true },
      { id: 'ink_3', brand: 'Intenze', name: 'True Black', hex: '#111111', k: 0.99, s: 0.01, owned: true },
      { id: 'ink_4', brand: 'Eternal', name: 'Solar Yellow', hex: '#facc15', k: 0.25, s: 0.75, owned: true }
    ];

    let mixerInks = [
      { ink: DEFAULT_STOCK[0], parts: 12 },
      { ink: DEFAULT_STOCK[1], parts: 4 },
      { ink: DEFAULT_STOCK[2], parts: 2 }
    ];

    const TARGET_CAP_DROPS = 20;

    /* =========================================================================
       2. COLOR SCIENCE: SUBTRACTIVE KUBELKA-MUNK APPROXIMATION
       ========================================================================= */
    function hexToRgb(hex) {
      const bigint = parseInt(hex.replace('#', ''), 16);
      return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => Math.round(x).toString(16).padStart(2, '0')).join('');
    }

    // Subtractive pigment synthesis (Weighted absorption & scattering model)
    function calculateSubtractiveBlend(components) {
      let totalWeight = components.reduce((acc, c) => acc + c.parts, 0);
      if (totalWeight === 0) return '#000000';

      let totalK = 0, totalS = 0;
      let rWeighted = 0, gWeighted = 0, bWeighted = 0;

      components.forEach(c => {
        let fraction = c.parts / totalWeight;
        let [r, g, b] = hexToRgb(c.ink.hex);

        // Compute subtractive absorbance (darkening/absorption curves)
        let absorbR = Math.pow((255 - r) / 255, 1.4);
        let absorbG = Math.pow((255 - g) / 255, 1.4);
        let absorbB = Math.pow((255 - b) / 255, 1.4);

        rWeighted += absorbR * fraction;
        gWeighted += absorbG * fraction;
        bWeighted += absorbB * fraction;

        totalK += c.ink.k * fraction;
        totalS += c.ink.s * fraction;
      });

      // Scatter reflection modifier based on white content/pigment density
      let scatterMod = totalS / (totalK + 0.001);
      let lumBonus = Math.min(1, scatterMod * 0.4);

      let finalR = Math.max(0, Math.min(255, (1 - Math.pow(rWeighted, 0.71)) * 255 + lumBonus * 30));
      let finalG = Math.max(0, Math.min(255, (1 - Math.pow(gWeighted, 0.71)) * 255 + lumBonus * 30));
      let finalB = Math.max(0, Math.min(255, (1 - Math.pow(bWeighted, 0.71)) * 255 + lumBonus * 30));

      return rgbToHex(finalR, finalG, finalB);
    }

    /* =========================================================================
       3. INTERFACE CONTROLLERS & DROP QUANTITIES
       ========================================================================= */
    function renderMixerControls() {
      const container = document.getElementById('sliders-target');
      container.innerHTML = '';

      let totalParts = mixerInks.reduce((acc, c) => acc + c.parts, 0);

      mixerInks.forEach((entry, idx) => {
        let percent = totalParts > 0 ? Math.round((entry.parts / totalParts) * 100) : 0;
        let approxDrops = totalParts > 0 ? Math.round((entry.parts / totalParts) * TARGET_CAP_DROPS) : 0;

        const card = document.createElement('div');
        card.className = 'ink-slider-card';
        card.innerHTML = `
          <div class="ink-slider-head">
            <div class="ink-info">
              <div class="ink-dot" style="background-color: ${entry.ink.hex};"></div>
              <span class="ink-name">${entry.ink.name}</span>
            </div>
            <div class="drop-count">≈ ${approxDrops} drops (${percent}%)</div>
          </div>
          <input type="range" min="0" max="50" value="${entry.parts}" oninput="updateRatio(${idx}, this.value)">
        `;
        container.appendChild(card);
      });

      updateCapGraphic();
    }

    function updateRatio(index, val) {
      mixerInks[index].parts = parseInt(val, 10);
      renderMixerControls();
    }

    function updateCapGraphic() {
      const color = calculateSubtractiveBlend(mixerInks);
      document.getElementById('liquid-cap').style.backgroundColor = color;
      document.getElementById('meta-hex').textContent = color.toUpperCase();
    }

    function resetDefaults() {
      mixerInks[0].parts = 12;
      mixerInks[1].parts = 4;
      mixerInks[2].parts = 2;
      renderMixerControls();
    }

    /* =========================================================================
       4. LOCAL-FIRST DATABASE ENGINE (INDEXEDDB)
       ========================================================================= */
    let db;
    const DB_NAME = 'CapmixLocalDB';
    const DB_VERSION = 1;

    function initDatabase() {
      const request = indexedDB.open(DB_NAME, DB_VERSION);

      request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains('recipes')) {
          db.createObjectStore('recipes', { keyPath: 'id' });
        }
      };

      request.onsuccess = (e) => {
        db = e.target.result;
        seedInitialData();
        loadRecipes();
      };
    }

    function seedInitialData() {
      const tx = db.transaction('recipes', 'readonly');
      const store = tx.objectStore('recipes');
      const req = store.count();
      req.onsuccess = () => {
        if (req.result === 0) {
          // Pre-populate Section 45 Master Reference Golden Test
          const goldenTestRecipe = {
            id: 'rec_burgundy_v2',
            name: 'Burgundy v2 (Raven Piece)',
            status: 'PROVEN',
            targetHex: '#521421',
            capSize: '15mm',
            dilution: '0%',
            ingredients: [
              { name: 'Deep Burgundy', drops: 12 },
              { name: 'Pure White', drops: 6 },
              { name: 'True Black', drops: 2 }
            ],
            timestamp: new Date().toISOString()
          };
          const writeTx = db.transaction('recipes', 'readwrite');
          writeTx.objectStore('recipes').put(goldenTestRecipe);
          writeTx.oncomplete = () => loadRecipes();
        }
      };
    }

    function saveActiveRecipe() {
      let totalParts = mixerInks.reduce((acc, c) => acc + c.parts, 0);
      if (totalParts === 0) return;

      const newRecipe = {
        id: 'rec_' + Date.now(),
        name: `Mix Result (${new Date().toLocaleDateString()})`,
        status: 'EXPERIMENT',
        targetHex: calculateSubtractiveBlend(mixerInks),
        capSize: '15mm',
        dilution: '0%',
        ingredients: mixerInks.map(m => ({
          name: m.ink.name,
          drops: Math.round((m.parts / totalParts) * TARGET_CAP_DROPS)
        })),
        timestamp: new Date().toISOString()
      };

      const tx = db.transaction('recipes', 'readwrite');
      tx.objectStore('recipes').put(newRecipe);
      tx.oncomplete = () => {
        loadRecipes();
        alert('Recipe committed to offline library.');
      };
    }

    function loadRecipes() {
      const container = document.getElementById('recipes-list');
      container.innerHTML = '';

      const tx = db.transaction('recipes', 'readonly');
      const store = tx.objectStore('recipes');
      store.openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const r = cursor.value;
          const card = document.createElement('div');
          card.className = 'recipe-card';
          card.innerHTML = `
            <div class="recipe-head">
              <div class="recipe-swatch" style="background-color: ${r.targetHex};"></div>
              <div style="flex: 1;">
                <b style="font-size: 13px;">${r.name}</b>
                <div class="badge ${r.status === 'PROVEN' ? 'badge-proven' : ''}">${r.status}</div>
              </div>
            </div>
            <div style="font-size: 11px; color: var(--text-muted); font-family: var(--font-mono);">
              ${r.ingredients.map(i => `${i.name} ≈${i.drops}d`).join(' | ')}
            </div>
          `;
          container.appendChild(card);
          cursor.continue();
        }
      };
    }

    function renderInventory() {
      const container = document.getElementById('inventory-list');
      container.innerHTML = '';
      DEFAULT_STOCK.forEach(ink => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        card.innerHTML = `
          <div class="recipe-head">
            <div class="recipe-swatch" style="background-color: ${ink.hex};"></div>
            <div>
              <b style="font-size: 13px;">${ink.brand} ${ink.name}</b>
              <div style="font-size: 11px; color: var(--text-muted);">Status: Available (In Stock)</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* =========================================================================
       5. VIEW ROUTER
       ========================================================================= */
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      btn.classList.add('
