<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f6c300">
  
  <link rel="manifest" href="manifest.json">

  <title>CAPMIX // WORKSTATION</title>

  <style>
    :root {
      --bg-studio: #f6c300;
      --text-main: #000000;
      --text-muted: #262626;
      --panel-border: rgba(0, 0, 0, 0.22);
      --btn-bg: rgba(0, 0, 0, 0.08);
      --btn-bg-hover: rgba(0, 0, 0, 0.16);
      --slider-track: rgba(0, 0, 0, 0.25);
      --slider-thumb: #000000;
      --card-bg: rgba(0, 0, 0, 0.05);
      --cap-plastic-edge: rgba(255, 255, 255, 0.7);
      --cap-shadow: rgba(0, 0, 0, 0.35);
    }

    body.theme-dark {
      --bg-studio: #101114;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --panel-border: rgba(255, 255, 255, 0.14);
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-bg-hover: rgba(255, 255, 255, 0.16);
      --slider-track: rgba(255, 255, 255, 0.2);
      --slider-thumb: #f6c300;
      --card-bg: rgba(255, 255, 255, 0.05);
      --cap-plastic-edge: rgba(255, 255, 255, 0.45);
      --cap-shadow: rgba(0, 0, 0, 0.75);
    }

    body.theme-light {
      --bg-studio: #ece7db;
      --text-main: #18181b;
      --text-muted: #52525b;
      --panel-border: rgba(0, 0, 0, 0.18);
      --btn-bg: rgba(0, 0, 0, 0.06);
      --btn-bg-hover: rgba(0, 0, 0, 0.14);
      --slider-track: rgba(0, 0, 0, 0.2);
      --slider-thumb: #18181b;
      --card-bg: rgba(0, 0, 0, 0.03);
      --cap-plastic-edge: rgba(255, 255, 255, 0.85);
      --cap-shadow: rgba(0, 0, 0, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-studio);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    /* TOP HEADER */
    .top-header {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-subtitle {
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.85;
      margin-top: 1px;
    }

    .cap-setup-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 8px;
      background: var(--btn-bg);
      border-radius: 6px;
      border: 1px solid var(--panel-border);
      font-size: 9px;
      font-weight: 800;
    }

    .theme-mode-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }

    .mode-icon-circle {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--bg-studio);
      border: 1.5px solid var(--text-main);
    }

    .mode-icon-box {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1.5px solid var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .mode-item.active .mode-icon-circle,
    .mode-item.active .mode-icon-box {
      box-shadow: 0 0 0 2px var(--bg-studio), 0 0 0 4px var(--text-main);
    }

    .mode-item span {
      font-size: 7.5px;
      font-weight: 700;
    }

    /* WORKSPACE RESPONSIVE ENGINE */
    .workspace {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* LANDSCAPE ORIENTATION: 3-column dock */
    @media (orientation: landscape) {
      .workspace {
        display: grid;
        grid-template-columns: 180px 1fr 280px;
        padding: 4px 14px;
        gap: 12px;
      }
      .left-rail { display: flex; flex-direction: column; gap: 8px; }
      .right-rail { display: flex; flex-direction: column; justify-content: space-around; gap: 6px; }
      .cap-stage { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
      .ink-cap-3d { width: 240px; height: 190px; }
      .cap-base-lip { width: 225px; height: 60px; }
      .cap-cylinder-body { width: 200px; height: 115px; }
      .cap-liquid-body { width: 190px; height: 105px; }
      .cap-top-meniscus { width: 200px; height: 75px; }
    }

    /* PORTRAIT ORIENTATION: Stacked Layout */
    @media (orientation: portrait) {
      .workspace {
        display: flex;
        flex-direction: column;
        padding: 4px 10px;
        gap: 8px;
        overflow-y: auto;
      }
      .left-rail {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 6px;
      }
      .camera-tabs { flex: 1; max-width: 140px; }
      .quick-actions { display: flex; flex-direction: row; gap: 4px; }
      .match-section { display: none; }
      .cap-stage {
        flex: 1;
        min-height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      .ink-cap-3d { width: 190px; height: 155px; }
      .cap-base-lip { width: 180px; height: 50px; }
      .cap-cylinder-body { width: 160px; height: 95px; }
      .cap-liquid-body { width: 150px; height: 85px; }
      .cap-top-meniscus { width: 160px; height: 60px; }
      .right-rail {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        gap: 6px;
        margin-bottom: 4px;
      }
      .ink-card { flex: 1; flex-direction: column; padding: 4px; }
      .stepper-col { flex-direction: row !important; height: auto !important; width: 100%; justify-content: space-between; }
    }

    /* SHARED LEFT CONTROLS */
    .camera-tabs {
      display: flex;
      background: var(--btn-bg);
      border-radius: 6px;
      padding: 2px;
      gap: 3px;
      border: 1px solid var(--panel-border);
    }

    .cam-btn {
      flex: 1;
      text-align: center;
      padding: 5px 0;
      border-radius: 4px;
      font-size: 8.5px;
      font-weight: 800;
      cursor: pointer;
      color: var(--text-main);
    }

    .cam-btn.active {
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .action-row-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .match-section {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .swatch-pair {
      display: flex;
      gap: 6px;
    }

    .swatch-chip {
      flex: 1;
      height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(0, 0, 0, 0.3);
    }

    /* CENTER STAGE / CAP SIMULATION */
    .ink-cap-3d {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cap-base-lip {
      position: absolute;
      bottom: 2px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.45) 0%, rgba(200,200,200,0.15) 60%, rgba(0,0,0,0.3) 98%);
      border: 2.5px solid var(--cap-plastic-edge);
      box-shadow: 0 16px 24px var(--cap-shadow);
      z-index: 1;
    }

    .cap-cylinder-body {
      position: absolute;
      bottom: 18px;
      border-radius: 0 0 100px 100px / 0 0 40px 40px;
      background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 15%, rgba(0,0,0,0.2) 50%, rgba(255,255,255,0.15) 85%, rgba(255,255,255,0.35) 100%);
      border-left: 2px solid var(--cap-plastic-edge);
      border-right: 2px solid var(--cap-plastic-edge);
      border-bottom: 3px solid var(--cap-plastic-edge);
      z-index: 2;
      display: flex;
      justify-content: center;
      overflow: hidden;
    }

    .cap-liquid-body {
      position: absolute;
      bottom: 4px;
      border-radius: 0 0 95px 95px / 0 0 35px 35px;
      background-color: #8c094e;
      transition: background-color 0.08s linear;
      box-shadow: inset 0 -10px 22px rgba(0,0,0,0.6), inset 0 8px 18px rgba(0,0,0,0.4);
    }

    .cap-top-meniscus {
      position: absolute;
      top: 20px;
      border-radius: 50%;
      background-color: #9c0a57;
      border: 2.5px solid var(--cap-plastic-edge);
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.5), 0 3px 8px rgba(0,0,0,0.3);
      z-index: 3;
      overflow: hidden;
      transition: background-color 0.08s linear;
    }

    .meniscus-gloss {
      position: absolute;
      top: 15%;
      left: 18%;
      width: 60%;
      height: 40%;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
      transform: rotate(-16deg);
    }

    .view-overhead {
      display: none;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 6px solid var(--cap-plastic-edge);
      box-shadow: 0 12px 24px var(--cap-shadow);
      background: #8c094e;
    }

    .view-submerged {
      display: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 45% 45%, #9c0a57 0%, #1a0010 100%);
      border-radius: 8px;
    }

    .cap-info-btn {
      position: absolute;
      bottom: 6px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-studio);
      border: 2px solid var(--text-main);
      color: var(--text-main);
      font-family: 'Times New Roman', serif;
      font-size: 17px;
      font-weight: bold;
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    /* RIGHT CONTROL RAIL / INK CARDS & STEPPERS */
    .ink-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 6px 8px;
    }

    .sphere-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      min-width: 100px;
    }

    .glossy-sphere {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 5px 10px rgba(0,0,0,0.35), inset -2px -3px 6px rgba(0,0,0,0.6);
      margin-bottom: 2px;
      border: 1.5px solid rgba(255,255,255,0.4);
    }

    .sphere-highlight {
      position: absolute;
      top: 10%;
      left: 20%;
      width: 38%;
      height: 25%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0) 80%);
      transform: rotate(-25deg);
    }

    .ink-title-text {
      font-size: 9.5px;
      font-weight: 800;
      text-align: center;
      line-height: 1.1;
    }

    .ink-badge-pct {
      font-size: 14px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: var(--text-main);
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 2px;
    }

    .stepper-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 70px;
    }

    .step-btn {
      width: 28px;
      height: 20px;
      background: var(--btn-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .step-btn:active {
      background: var(--btn-bg-hover);
      transform: scale(0.92);
    }

    /* RELIABLE NATIVE SLIDER */
    .slider-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 70px;
    }

    input[type=range].native-vertical {
      -webkit-appearance: none;
      appearance: none;
      writing-mode: vertical-lr;
      direction: rtl;
      width: 8px;
      height: 60px;
      background: var(--slider-track);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type=range].native-vertical::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 12px;
      border-radius: 3px;
      background: var(--slider-thumb);
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* BOTTOM DOCK */
    .bottom-dock {
      height: 42px;
      background: var(--bg-studio);
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .nav-tab-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      color: var(--text-main);
      cursor: pointer;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-tab-btn.active {
      border-bottom: 2px solid var(--text-main);
    }

    /* MODAL SHEETS */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: var(--bg-studio);
      border: 2px solid var(--text-main);
      color: var(--text-main);
      border-radius: 10px;
      padding: 14px;
      width: 340px;
      max-width: 90vw;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .ink-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .ink-choice-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px;
      cursor: pointer;
      text-align: left;
    }

    .dot-preview {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    .color-swatch-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .color-tile {
      height: 36px;
      border-radius: 6px;
      border: 1.5px solid var(--text-main);
      cursor: pointer;
    }
  </style>
</head>
<body class="theme-colour">

  <!-- TOP BAR -->
  <header class="top-header">
    <div>
      <div class="brand-title">CAPMIX //</div>
      <div class="brand-subtitle">REAL-TIME WORKSTATION</div>
    </div>

    <div class="cap-setup-badge" onclick="alert('Cap Volume: 15mm Standard Poly')">
      <span>⚏ CAP SETUP</span>
    </div>

    <div class="theme-mode-cluster">
      <div class="mode-item active" id="btn-mode-colour" onclick="handleColourClick()">
        <div class="mode-icon-circle"></div>
        <span>Colour</span>
      </div>
      <div class="mode-item" id="btn-mode-dark" onclick="setAppTheme('dark')">
        <div class="mode-icon-box">🌙</div>
        <span>Dark</span>
      </div>
      <div class="mode-item" id="btn-mode-light" onclick="setAppTheme('light')">
        <div class="mode-icon-box">☀️</div>
        <span>Light</span>
      </div>
    </div>
  </header>

  <!-- ADAPTIVE WORKSPACE -->
  <main class="workspace">
    
    <!-- LEFT UTILITY RAIL -->
    <aside class="left-rail">
      <div class="camera-tabs">
        <div class="cam-btn" id="cam-top" onclick="setCameraView('top')">TOP</div>
        <div class="cam-btn active" id="cam-front" onclick="setCameraView('front')">FRONT</div>
        <div class="cam-btn" id="cam-ink" onclick="setCameraView('ink')">INK</div>
      </div>

      <div class="quick-actions">
        <button class="action-row-btn" onclick="alert('Reference Loaded: #8c094e')">📥 Load Color</button>
        <button class="action-row-btn" onclick="alert('Saved to Project Palette')">🎨 Save Palette</button>
        <button class="action-row-btn" onclick="alert('Added to Favorites')">★ Add Favorite</button>
      </div>

      <div class="match-section">
        <div style="font-size: 8px; font-weight: 800; opacity: 0.85;">delta · E match: 0.1 (EXACT)</div>
        <div class="swatch-pair">
          <div class="swatch-chip" id="target-swatch" style="background-color: #8c094e;"></div>
          <div class="swatch-chip" id="result-swatch" style="background-color: #8c094e;"></div>
        </div>
      </div>
    </aside>

    <!-- CENTER INK CAP STAGE -->
    <section class="cap-stage">
      <div class="ink-cap-3d" id="viewport-front">
        <div class="cap-base-lip"></div>
        <div class="cap-cylinder-body">
          <div class="cap-liquid-body" id="cap-liquid-deep"></div>
        </div>
        <div class="cap-top-meniscus" id="cap-liquid-surface">
          <div class="meniscus-gloss"></div>
        </div>
      </div>

      <div class="view-overhead" id="viewport-top"></div>
      <div class="view-submerged" id="viewport-ink"></div>

      <div class="cap-info-btn" onclick="toggleModal('info-modal', true)">i</div>
    </section>

    <!-- RIGHT CONTROLS: STEPPERS, SLIDERS & CHANNEL PICKERS -->
    <aside class="right-rail">
      
      <!-- Channel 0 -->
      <div class="ink-card">
        <div class="sphere-wrap" onclick="openInkSelector(0)">
          <div class="glossy-sphere" id="sphere-0" style="background: #0a2342;">
            <div class="sphere-highlight"></div>
          </div>
          <div class="ink-title-text" id="label-ink-0">Prussian Blue</div>
          <div class="ink-badge-pct" id="pct-0">45%</div>
        </div>
        <div class="stepper-col">
          <button class="step-btn" onclick="stepRatio(0, 1)">▲</button>
          <div class="slider-box">
            <input type="range" class="native-vertical" min="0" max="100" value="45" id="slider-0" oninput="onDirectSlide(0, this.value)">
          </div>
          <button class="step-btn" onclick="stepRatio(0, -1)">▼</button>
        </div>
      </div>

      <!-- Channel 1 -->
      <div class="ink-card">
        <div class="sphere-wrap" onclick="openInkSelector(1)">
          <div class="glossy-sphere" id="sphere-1" style="background: #d6006e;">
            <div class="sphere-highlight"></div>
          </div>
          <div class="ink-title-text" id="label-ink-1">Process Magenta</div>
          <div class="ink-badge-pct" id="pct-1">45%</div>
        </div>
        <div class="stepper-col">
          <button class="step-btn" onclick="stepRatio(1, 1)">▲</button>
          <div class="slider-box">
            <input type="range" class="native-vertical" min="0" max="100" value="45" id="slider-1" oninput="onDirectSlide(1, this.value)">
          </div>
          <button class="step-btn" onclick="stepRatio(1, -1)">▼</button>
        </div>
      </div>

      <!-- Channel 2 -->
      <div class="ink-card">
        <div class="sphere-wrap" onclick="openInkSelector(2)">
          <div class="glossy-sphere" id="sphere-2" style="background: #ffffff;">
            <div class="sphere-highlight"></div>
          </div>
          <div class="ink-title-text" id="label-ink-2">Pure White</div>
          <div class="ink-badge-pct" id="pct-2">10%</div>
        </div>
        <div class="stepper-col">
          <button class="step-btn" onclick="stepRatio(2, 1)">▲</button>
          <div class="slider-box">
            <input type="range" class="native-vertical" min="0" max="100" value="10" id="slider-2" oninput="onDirectSlide(2, this.value)">
          </div>
          <button class="step-btn" onclick="stepRatio(2, -1)">▼</button>
        </div>
      </div>

    </aside>

  </main>

  <!-- BOTTOM DOCK -->
  <nav class="bottom-dock">
    <div class="nav-tab-btn">🎨 Reference</div>
    <div class="nav-tab-btn active">🧪 Mixer</div>
    <div class="nav-tab-btn">⚏ Tray Opti</div>
    <div class="nav-tab-btn">📁 Archive</div>
    <div class="nav-tab-btn">⚙️ Settings</div>
  </nav>

  <!-- MODAL 1: STOCK INK PICKER TRAY -->
  <div class="modal-backdrop" id="ink-picker-modal" onclick="toggleModal('ink-picker-modal', false)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-weight: 900; font-size: 12px; text-transform: uppercase;">Select Stock Ink</div>
      <div class="ink-grid" id="ink-choices-list"></div>
      <button class="action-row-btn" style="justify-content: center;" onclick="toggleModal('ink-picker-modal', false)">Cancel</button>
    </div>
  </div>

  <!-- MODAL 2: STUDIO BACKGROUND COLOR SELECTOR -->
  <div class="modal-backdrop" id="bg-picker-modal" onclick="toggleModal('bg-picker-modal', false)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-weight: 900; font-size: 12px; text-transform: uppercase;">Studio Background Tone</div>
      <div class="color-swatch-grid">
        <div class="color-tile" style="background: #f6c300;" onclick="setCustomBg('#f6c300')"></div>
        <div class="color-tile" style="background: #f59e0b;" onclick="setCustomBg('#f59e0b')"></div>
        <div class="color-tile" style="background: #e11d48;" onclick="setCustomBg('#e11d48')"></div>
        <div class="color-tile" style="background: #8b5cf6;" onclick="setCustomBg('#8b5cf6')"></div>
        <div class="color-tile" style="background: #10b981;" onclick="setCustomBg('#10b981')"></div>
        <div class="color-tile" style="background: #0284c7;" onclick="setCustomBg('#0284c7')"></div>
        <div class="color-tile" style="background: #475569;" onclick="setCustomBg('#475569')"></div>
        <div class="color-tile" style="background: #1e293b;" onclick="setCustomBg('#1e293b')"></div>
      </div>
      <button class="action-row-btn" style="justify-content: center;" onclick="toggleModal('bg-picker-modal', false)">Done</button>
    </div>
  </div>

  <!-- MODAL 3: DISPENSE GUIDE -->
  <div class="modal-backdrop" id="info-modal" onclick="toggleModal('info-modal', false)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-weight: 900; font-size: 12px; text-transform: uppercase;">Cap Dispense Guide</div>
      <div style="font-size: 11px; display: flex; flex-direction: column; gap: 6px;" id="drop-breakdown-table"></div>
      <button class="action-row-btn" style="justify-content: center; margin-top: 6px;" onclick="toggleModal('info-modal', false)">Close</button>
    </div>
  </div>

  <script>
    /* STOCK INK INVENTORY */
    const STOCK_CATALOG = [
      { name: 'Prussian Blue (PB-04)', hex: '#0a2342', k: [0.85, 0.45, 0.10], s: [0.15, 0.20, 0.40] },
      { name: 'Process Magenta (FM-03)', hex: '#d6006e', k: [0.10, 0.90, 0.30], s: [0.30, 0.10, 0.30] },
      { name: 'World Famous Pure White (PW-02)', hex: '#ffffff', k: [0.01, 0.01, 0.01], s: [0.99, 0.99, 0.99] },
      { name: 'Solar Yellow (SY-01)', hex: '#facc15', k: [0.05, 0.15, 0.85], s: [0.80, 0.70, 0.10] },
      { name: 'Fire Orange (FO-08)', hex: '#ea580c', k: [0.10, 0.75, 0.90], s: [0.65, 0.25, 0.05] },
      { name: 'True Lining Black (BK-00)', hex: '#111111', k: [0.98, 0.98, 0.98], s: [0.01, 0.01, 0.01] },
      { name: 'Deep Burgundy (BG-09)', hex: '#581825', k: [0.60, 0.92, 0.80], s: [0.30, 0.08, 0.15] }
    ];

    let activeInks = [STOCK_CATALOG[0], STOCK_CATALOG[1], STOCK_CATALOG[2]];
    let currentRatios = [45, 45, 10];
    let selectedChannel = 0;
    let isColourThemeActive = true;

    /* KUBELKA-MUNK MIXING CORE */
    function kmReflectance(k, s) {
      if (s <= 0.0001) return 0;
      let ks = k / s;
      return 1 + ks - Math.sqrt(Math.pow(ks, 2) + 2 * ks);
    }

    function calculateSubtractiveMix(ratios) {
      let sum = ratios.reduce((a, b) => a + b, 0);
      if (sum === 0) return '#000000';

      let totalK = [0, 0, 0];
      let totalS = [0, 0, 0];

      for (let i = 0; i < 3; i++) {
        let frac = ratios[i] / sum;
        for (let c = 0; c < 3; c++) {
          totalK[c] += activeInks[i].k[c] * frac;
          totalS[c] += activeInks[i].s[c] * frac;
        }
      }

      let r = Math.round(kmReflectance(totalK[0], totalS[0]) * 255);
      let g = Math.round(kmReflectance(totalK[1], totalS[1]) * 255);
      let b = Math.round(kmReflectance(totalK[2], totalS[2]) * 255);

      return "#" + [r, g, b].map(x => Math.max(0, Math.min(255, x)).toString(16).padStart(2, '0')).join('');
    }

    /* STEPPERS AND DIRECT SLIDING */
    function stepRatio(idx, delta) {
      let target = Math.max(0, Math.min(100, currentRatios[idx] + delta));
      onDirectSlide(idx, target);
    }

    function onDirectSlide(idx, val) {
      let v = parseInt(val, 10);
      currentRatios[idx] = v;

      let others = [0, 1, 2].filter(i => i !== idx);
      let remainder = 100 - v;
      let otherSum = currentRatios[others[0]] + currentRatios[others[1]];

      if (otherSum === 0) {
        currentRatios[others[0]] = Math.round(remainder / 2);
        currentRatios[others[1]] = remainder - currentRatios[others[0]];
      } else {
        let f = currentRatios[others[0]] / otherSum;
        currentRatios[others[0]] = Math.max(0, Math.round(remainder * f));
        currentRatios[others[1]] = Math.max(0, remainder - currentRatios[others[0]]);
      }

      renderUI();
    }

    function renderUI() {
      for (let i = 0; i < 3; i++) {
        document.getElementById(`slider-${i}`).value = currentRatios[i];
        document.getElementById(`pct-${i}`).textContent = `${currentRatios[i]}%`;
        document.getElementById(`label-ink-${i}`).textContent = activeInks[i].name.split(' (')[0];
        document.getElementById(`sphere-${i}`).style.background = activeInks[i].hex;
      }

      const mixedHex = calculateSubtractiveMix(currentRatios);

      document.getElementById('cap-liquid-surface').style.backgroundColor = mixedHex;
      document.getElementById('cap-liquid-deep').style.backgroundColor = mixedHex;
      document.getElementById('viewport-top').style.backgroundColor = mixedHex;
      document.getElementById('viewport-ink').style.background = `radial-gradient(circle at 45% 45%, ${mixedHex} 0%, #10020a 85%)`;
      document.getElementById('result-swatch').style.backgroundColor = mixedHex;
      document.getElementById('target-swatch').style.backgroundColor = mixedHex;

      // Drop specifications
      const CAP_DROPS = 20;
      let html = `<p><strong>Standard 15mm Cap</strong> (≈ 20 Drops Total)</p>`;
      for (let i = 0; i < 3; i++) {
        let drops = Math.round((currentRatios[i] / 100) * CAP_DROPS);
        html += `<div style="display:flex; justify-content:space-between; border-bottom: 1px solid var(--panel-border); padding: 4px 0;">
          <span>${activeInks[i].name}</span>
          <strong>≈ ${drops} drops (${currentRatios[i]}%)</strong>
        </div>`;
      }
      document.getElementById('drop-breakdown-table').innerHTML = html;
    }

    /* INK CHANNEL SELECTION */
    function openInkSelector(channelIdx) {
      selectedChannel = channelIdx;
      const list = document.getElementById('ink-choices-list');
      list.innerHTML = '';

      STOCK_CATALOG.forEach((ink) => {
        const btn = document.createElement('div');
        btn.className = 'ink-choice-btn';
        btn.innerHTML = `
          <div class="dot-preview" style="background:${ink.hex};"></div>
          <span style="font-size:10.5px; font-weight:700;">${ink.name.split(' (')[0]}</span>
        `;
        btn.onclick = () => {
          activeInks[selectedChannel] = ink;
          toggleModal('ink-picker-modal', false);
          renderUI();
        };
        list.appendChild(btn);
      });

      toggleModal('ink-picker-modal', true);
    }

    /* THEME & COLOUR BACKGROUND SELECTOR */
    function handleColourClick() {
      if (isColourThemeActive) {
        // Already active -> open background color picker
        toggleModal('bg-picker-modal', true);
      } else {
        setAppTheme('colour');
      }
    }

    function setCustomBg(hex) {
      document.documentElement.style.setProperty('--bg-studio', hex);
      toggleModal('bg-picker-modal', false);
    }

    function setAppTheme(theme) {
      document.body.classList.remove('theme-colour', 'theme-dark', 'theme-light');
      document.querySelectorAll('.mode-item').forEach(m => m.classList.remove('active'));

      if (theme === 'dark') {
        isColourThemeActive = false;
        document.body.classList.add('theme-dark');
        document.getElementById('btn-mode-dark').classList.add('active');
      } else if (theme === 'light') {
        isColourThemeActive = false;
        document.body.classList.add('theme-light');
        document.getElementById('btn-mode-light').classList.add('active');
      } else {
        isColourThemeActive = true;
        document.body.classList.add('theme-colour');
        document.getElementById('btn-mode-colour').classList.add('active');
      }
    }

    /* VIEWPORT CAMERAS */
    function setCameraView(view) {
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`cam-${view}`).classList.add('active');

      document.getElementById('viewport-front').style.display = (view === 'front') ? 'flex' : 'none';
      document.getElementById('viewport-top').style.display = (view === 'top') ? 'block' : 'none';
      document.getElementById('viewport-ink').style.display = (view === 'ink') ? 'block' : 'none';
    }

    function toggleModal(id, show) {
      document.getElementById(id).style.display = show ? 'flex' : 'none';
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderUI();
    });
    
    // Service Worker Registration for PWA Install
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
