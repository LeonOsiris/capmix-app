<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CAPMIX // Real-Time Tattoo Ink Sandbox</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f6c300">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-canvas: #f6c300;
      --panel-bg: #f6c300;
      --panel-border: rgba(0, 0, 0, 0.25);
      --text-main: #141414;
      --btn-bg: rgba(0, 0, 0, 0.08);
      --btn-bg-hover: rgba(0, 0, 0, 0.16);
      --thumb-bg: #141414;
      --track-bg: rgba(0, 0, 0, 0.2);
    }

    body.theme-dark {
      --bg-canvas: #111215;
      --panel-bg: #181a1f;
      --panel-border: rgba(255, 255, 255, 0.15);
      --text-main: #f0f0f0;
      --btn-bg: rgba(255, 255, 255, 0.08);
      --btn-bg-hover: rgba(255, 255, 255, 0.16);
      --thumb-bg: #f6c300;
      --track-bg: rgba(255, 255, 255, 0.18);
    }

    body.theme-light {
      --bg-canvas: #ece7db;
      --panel-bg: #f5f2eb;
      --panel-border: rgba(0, 0, 0, 0.15);
      --text-main: #1c1c1a;
      --btn-bg: rgba(0, 0, 0, 0.06);
      --btn-bg-hover: rgba(0, 0, 0, 0.12);
      --thumb-bg: #1c1c1a;
      --track-bg: rgba(0, 0, 0, 0.15);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    .font-stencil {
      font-family: -apple-system, BlinkMacSystemFont, "Impact", "Arial Black", sans-serif;
      letter-spacing: -0.03em;
    }

    /* Glossy 3D pigment spheres */
    .glossy-sphere {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      position: relative;
      box-shadow: 
        0 8px 16px rgba(0, 0, 0, 0.38),
        0 2px 4px rgba(0, 0, 0, 0.2),
        inset -4px -6px 12px rgba(0, 0, 0, 0.65),
        inset 2px 2px 6px rgba(255, 255, 255, 0.4);
      border: 2px solid rgba(255, 255, 255, 0.45);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .glossy-sphere:hover {
      transform: scale(1.05);
      box-shadow: 
        0 10px 20px rgba(0, 0, 0, 0.45),
        inset -4px -6px 12px rgba(0, 0, 0, 0.65),
        inset 2px 2px 8px rgba(255, 255, 255, 0.6);
    }

    .sphere-highlight {
      position: absolute;
      top: 10%;
      left: 18%;
      width: 42%;
      height: 28%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.4) 45%, rgba(255, 255, 255, 0) 80%);
      transform: rotate(-22deg);
      pointer-events: none;
    }

    .sphere-rim-light {
      position: absolute;
      bottom: 8%;
      right: 14%;
      width: 35%;
      height: 20%;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 75%);
      pointer-events: none;
    }

    /* Vertical Slider */
    .v-slider-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      touch-action: none;
      position: relative;
      cursor: pointer;
      padding: 4px 10px;
    }

    .v-slider-track {
      width: 10px;
      height: 80px;
      background: var(--track-bg);
      border-radius: 5px;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    .v-slider-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--thumb-bg);
      border-radius: 0 0 5px 5px;
      opacity: 0.35;
    }

    .v-slider-thumb {
      position: absolute;
      left: 50%;
      transform: translate(-50%, 50%);
      width: 24px;
      height: 14px;
      border-radius: 4px;
      background: var(--thumb-bg);
      border: 1.5px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      transition: transform 0.05s ease, box-shadow 0.1s ease;
      pointer-events: none;
    }

    .v-slider-container:hover .v-slider-thumb,
    .v-slider-container.is-active .v-slider-thumb {
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(255, 255, 255, 0.6);
      transform: translate(-50%, 50%) scale(1.08);
    }

    .ink-swirl-wave {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 43% 57% 65% 35% / 40% 45% 55% 60%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 65%);
      animation: rotateSwirl 16s linear infinite alternate;
    }

    @keyframes rotateSwirl {
      from { transform: rotate(0deg) scale(0.95); }
      to { transform: rotate(180deg) scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- SUBTRACTIVE COLOR MIXING & DELTA-E UTILITIES ---
    function hexToRgb(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      const clamp = (v) => Math.max(0, Math.min(255, Math.round(v)));
      return '#' + [r, g, b].map(v => clamp(v).toString(16).padStart(2, '0')).join('');
    }

    function mixSubtractive(channels) {
      const valid = channels.filter(c => c.percentage > 0);
      if (valid.length === 0) return '#ffffff';
      const total = valid.reduce((sum, c) => sum + c.percentage, 0);

      let totalC = 0, totalM = 0, totalY = 0, totalK = 0;
      valid.forEach(c => {
        const rgb = hexToRgb(c.ink.hex);
        const rNorm = rgb.r / 255, gNorm = rgb.g / 255, bNorm = rgb.b / 255;
        const k = 1 - Math.max(rNorm, gNorm, bNorm);
        const invK = 1 - k || 0.0001;
        const cyan = (1 - rNorm - k) / invK;
        const magenta = (1 - gNorm - k) / invK;
        const yellow = (1 - bNorm - k) / invK;

        const weight = c.percentage / total;
        totalC += cyan * weight;
        totalM += magenta * weight;
        totalY += yellow * weight;
        totalK += k * weight;
      });

      const invKFinal = 1 - totalK;
      const r = Math.round(255 * (1 - totalC) * invKFinal);
      const g = Math.round(255 * (1 - totalM) * invKFinal);
      const b = Math.round(255 * (1 - totalY) * invKFinal);
      return rgbToHex(r, g, b);
    }

    function calcDeltaE(hexA, hexB) {
      const rgbA = hexToRgb(hexA);
      const rgbB = hexToRgb(hexB);
      const rDiff = rgbA.r - rgbB.r;
      const gDiff = rgbA.g - rgbB.g;
      const bDiff = rgbA.b - rgbB.b;
      return Math.round(Math.sqrt(rDiff * rDiff + gDiff * gDiff + bDiff * bDiff) / 4.41 * 10) / 10;
    }

    // Default Inks
    const INK_PALETTE = [
      { id: 'pb-04', name: 'Prussian Blue', code: 'PB-04', hex: '#11224d' },
      { id: 'fm-03', name: 'Process Magenta', code: 'FM-03', hex: '#cf087a' },
      { id: 'pw-02', name: 'Pure White', code: 'PW-02', hex: '#fcfcfc' },
      { id: 'tb-01', name: 'Triple Black', code: 'TB-01', hex: '#0a0a0a' },
      { id: 'sy-05', name: 'Solar Yellow', code: 'SY-05', hex: '#ffd200' },
      { id: 'cg-06', name: 'Cyan Green', code: 'CG-06', hex: '#00a388' }
    ];

    // --- VERTICAL SLIDER COMPONENT ---
    function VerticalSlider({ value, onChange, height = 80, ariaLabel = "Ratio slider" }) {
      const trackRef = useRef(null);
      const [isDragging, setIsDragging] = useState(false);

      const updateFromPointer = useCallback((clientY) => {
        if (!trackRef.current) return;
        const rect = trackRef.current.getBoundingClientRect();
        const relativeY = clientY - rect.top;
        const clampedY = Math.max(0, Math.min(rect.height, relativeY));
        const pct = Math.round(((rect.height - clampedY) / rect.height) * 100);
        onChange(Math.max(0, Math.min(100, pct)));
      }, [onChange]);

      const handlePointerDown = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragging(true);
        e.currentTarget.setPointerCapture(e.pointerId);
        updateFromPointer(e.clientY);
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        e.preventDefault();
        updateFromPointer(e.clientY);
      };

      const handlePointerUp = (e) => {
        if (isDragging) {
          setIsDragging(false);
          try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
        }
      };

      return (
        <div
          role="slider"
          aria-label={ariaLabel}
          aria-valuenow={value}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          onPointerCancel={handlePointerUp}
          className={`v-slider-container w-10 flex flex-col items-center justify-center outline-none ${isDragging ? 'is-active' : ''}`}
          style={{ height: `${height + 20}px` }}
        >
          <div ref={trackRef} className="v-slider-track" style={{ height: `${height}px` }}>
            <div className="v-slider-fill" style={{ height: `${value}%` }} />
            <div className="v-slider-thumb" style={{ bottom: `${value}%` }} />
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [theme, setTheme] = useState('colour');
      const [cameraView, setCameraView] = useState('front');
      const [capSize, setCapSize] = useState('medium');
      const [targetHex, setTargetHex] = useState('#8c094e');
      const [toast, setToast] = useState(null);
      const [isCapInfoOpen, setIsCapInfoOpen] = useState(false);
      const [isInkSelectorOpen, setIsInkSelectorOpen] = useState(false);
      const [selectedChanIdx, setSelectedChanIdx] = useState(0);
      const [activeTab, setActiveTab] = useState('mixer');

      const colorPickerRef = useRef(null);

      // 3 Ink channels displayed together
      const [channels, setChannels] = useState([
        { id: 'ch-0', ink: INK_PALETTE[0], percentage: 45 },
        { id: 'ch-1', ink: INK_PALETTE[1], percentage: 45 },
        { id: 'ch-2', ink: INK_PALETTE[2], percentage: 10 }
      ]);

      // Apply theme to document body
      useEffect(() => {
        document.body.className = `theme-${theme}`;
      }, [theme]);

      // Subtractive mixed hex
      const mixedHex = useMemo(() => mixSubtractive(channels), [channels]);
      const deltaE = useMemo(() => calcDeltaE(targetHex, mixedHex), [targetHex, mixedHex]);

      const handleSliderChange = (index, newVal) => {
        setChannels(prev => prev.map((ch, i) => i === index ? { ...ch, percentage: newVal } : ch));
      };

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 2200);
      };

      const cycleCapSize = (dir) => {
        const sizes = ['small', 'medium', 'large'];
        const cur = sizes.indexOf(capSize);
        const next = sizes[(cur + dir + sizes.length) % sizes.length];
        setCapSize(next);
      };

      return (
        <div className="w-screen h-screen flex flex-col justify-between overflow-hidden relative">
          
          {/* Hidden Target Color Input */}
          <input
            ref={colorPickerRef}
            type="color"
            value={targetHex}
            onChange={(e) => setTargetHex(e.target.value)}
            className="sr-only"
          />

          {/* Toast Notification */}
          {toast && (
            <div className="absolute top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-1.5 rounded-full bg-black text-white text-xs font-black shadow-2xl animate-bounce">
              {toast}
            </div>
          )}

          {/* ========================================================================= */}
          {/* TOP HEADER: Branding, Cap Setup, Theme Switchers                          */}
          {/* ========================================================================= */}
          <header className="border-b border-[var(--panel-border)] flex items-center justify-between px-4 md:px-6 h-14 shrink-0 z-30">
            {/* Left: Brand */}
            <div className="flex flex-col cursor-pointer" onClick={() => setActiveTab('mixer')}>
              <div className="font-stencil font-black text-xl md:text-2xl leading-none">
                CAPMIX //
              </div>
              <div className="text-[8.5px] md:text-[9.5px] font-black tracking-widest uppercase opacity-85 mt-0.5">
                REAL-TIME SANDBOX
              </div>
            </div>

            {/* Center-Left: Cap Setup Pill with Chevrons */}
            <div className="flex items-center gap-1.5 md:gap-2">
              <button
                type="button"
                onClick={() => setIsCapInfoOpen(true)}
                className="flex flex-col items-center justify-center px-3 py-1 rounded-2xl border-2 border-black/30 hover:border-black transition-all cursor-pointer shadow-xs"
              >
                <div className="w-5 h-2.5 rounded-t-sm border border-black/80 bg-white/50" />
                <span className="text-[7.5px] md:text-[8.5px] font-black tracking-wider uppercase mt-0.5">
                  CAP SETUP ({capSize.toUpperCase()})
                </span>
              </button>

              <button
                onClick={() => cycleCapSize(-1)}
                className="w-6 h-6 rounded-full hover:bg-[var(--btn-bg)] flex items-center justify-center text-xs font-black opacity-75 hover:opacity-100"
              >
                &lt;
              </button>
              <button
                onClick={() => cycleCapSize(1)}
                className="w-6 h-6 rounded-full hover:bg-[var(--btn-bg)] flex items-center justify-center text-xs font-black opacity-75 hover:opacity-100"
              >
                &gt;
              </button>
            </div>

            {/* Right: Theme Switcher */}
            <div className="flex items-center gap-2">
              <div
                onClick={() => setTheme('colour')}
                className={`flex flex-col items-center cursor-pointer p-1 transition-transform ${theme === 'colour' ? 'scale-110 font-black' : 'opacity-70'}`}
                title="CapMix Gold Theme"
              >
                <div className="w-5 h-5 rounded-full bg-black border-2 border-black shadow-xs" />
                <span className="text-[8px] font-black uppercase mt-0.5">Colour</span>
              </div>

              <div
                onClick={() => setTheme('dark')}
                className={`flex flex-col items-center cursor-pointer p-1 transition-transform ${theme === 'dark' ? 'scale-110 font-black' : 'opacity-70'}`}
                title="Studio Dark Theme"
              >
                <div className="w-5 h-5 rounded-md flex items-center justify-center text-[10px] border-2 border-black/40 bg-black/10">
                  🌙
                </div>
                <span className="text-[8px] font-black uppercase mt-0.5">Dark</span>
              </div>

              <div
                onClick={() => setTheme('light')}
                className={`flex flex-col items-center cursor-pointer p-1 transition-transform ${theme === 'light' ? 'scale-110 font-black' : 'opacity-70'}`}
                title="Parchment Light Theme"
              >
                <div className="w-5 h-5 rounded-md flex items-center justify-center text-[10px] border-2 border-black/40 bg-white/80">
                  ☀️
                </div>
                <span className="text-[8px] font-black uppercase mt-0.5">Light</span>
              </div>
            </div>
          </header>

          {/* ========================================================================= */}
          {/* MAIN STAGE (CONSOLIDATED SINGLE-SCREEN)                                    */}
          {/* ========================================================================= */}
          <main className="flex-1 flex flex-col md:flex-row items-stretch justify-between p-3 md:p-6 overflow-hidden gap-3 md:gap-4 relative">
            
            {/* --- LEFT COLUMN: Camera Switcher, Quick Actions, Delta-E Match --- */}
            <div className="w-full md:w-[210px] lg:w-[230px] flex flex-row md:flex-col justify-between shrink-0 z-10 gap-3">
              
              <div className="flex flex-col gap-3 flex-1">
                {/* Camera Tabs */}
                <div className="bg-[var(--btn-bg)] p-1 rounded-xl flex items-center justify-between border border-[var(--panel-border)] shadow-xs">
                  <button
                    onClick={() => setCameraView('top')}
                    className={`flex-1 py-1.5 px-2 rounded-lg text-xs font-black transition-all ${cameraView === 'top' ? 'bg-white text-black shadow-md' : 'opacity-80'}`}
                  >
                    TOP
                  </button>
                  <button
                    onClick={() => setCameraView('front')}
                    className={`flex-1 py-1.5 px-2 rounded-lg text-xs font-black transition-all ${cameraView === 'front' ? 'bg-white text-black shadow-md' : 'opacity-80'}`}
                  >
                    FRONT
                  </button>
                  <button
                    onClick={() => setCameraView('ink')}
                    className={`flex-1 py-1.5 px-2 rounded-lg text-xs font-black transition-all ${cameraView === 'ink' ? 'bg-white text-black shadow-md' : 'opacity-80'}`}
                  >
                    INK
                  </button>
                </div>

                {/* Quick Actions */}
                <div className="hidden md:flex flex-col gap-2">
                  <button
                    onClick={() => colorPickerRef.current && colorPickerRef.current.click()}
                    className="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-[var(--btn-bg-hover)] text-xs font-extrabold text-left transition-all"
                  >
                    <div className="w-7 h-7 rounded-lg bg-[var(--btn-bg)] border border-[var(--panel-border)] flex items-center justify-center">
                      📥
                    </div>
                    <span>Load Color</span>
                  </button>

                  <button
                    onClick={() => showToast('Saved to Palette!')}
                    className="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-[var(--btn-bg-hover)] text-xs font-extrabold text-left transition-all"
                  >
                    <div className="w-7 h-7 rounded-lg bg-[var(--btn-bg)] border border-[var(--panel-border)] flex items-center justify-center">
                      🎨
                    </div>
                    <span>Save to Palette</span>
                  </button>

                  <button
                    onClick={() => showToast('Added to Favorites!')}
                    className="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-[var(--btn-bg-hover)] text-xs font-extrabold text-left transition-all"
                  >
                    <div className="w-7 h-7 rounded-lg bg-[var(--btn-bg)] border border-[var(--panel-border)] flex items-center justify-center">
                      ⭐
                    </div>
                    <span>Add to Favorites</span>
                  </button>

                  <button
                    onClick={() => setIsCapInfoOpen(true)}
                    className="w-full flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-[var(--btn-bg-hover)] text-xs font-extrabold text-left transition-all"
                  >
                    <div className="w-7 h-7 rounded-lg bg-[var(--btn-bg)] border border-[var(--panel-border)] flex items-center justify-center">
                      ⏱️
                    </div>
                    <span>Mix History</span>
                  </button>
                </div>
              </div>

              {/* Delta-E Match Box */}
              <div className="flex flex-col gap-1.5 pt-1">
                <div className="text-[11px] font-black tracking-wider opacity-85">
                  delta · E match ({deltaE})
                </div>
                <div className="flex items-center gap-2">
                  <div
                    onClick={() => colorPickerRef.current && colorPickerRef.current.click()}
                    className="flex-1 flex flex-col gap-1 cursor-pointer"
                    title="Click to pick target color"
                  >
                    <span className="text-[9.5px] font-black opacity-80">Target Color</span>
                    <div className="h-9 w-full rounded-lg border border-black/25 shadow-inner" style={{ backgroundColor: targetHex }} />
                  </div>
                  <div className="flex-1 flex flex-col gap-1">
                    <span className="text-[9.5px] font-black opacity-80">Match Result</span>
                    <div className="h-9 w-full rounded-lg border border-black/25 shadow-inner" style={{ backgroundColor: mixedHex }} />
                  </div>
                </div>
              </div>
            </div>

            {/* --- CENTER STAGE: 3D Ink Cap & Info Button --- */}
            <div className="flex-1 flex items-center justify-center relative overflow-hidden my-2 md:my-0">
              
              {cameraView === 'front' && (
                <div className="relative flex flex-col items-center justify-center w-[280px] lg:w-[350px] h-[260px] lg:h-[320px]">
                  {/* Flared Silicone Base */}
                  <div
                    className="absolute bottom-4 w-[260px] lg:w-[320px] h-[75px] lg:h-[90px] rounded-full border-[3px] border-white/70 shadow-2xl z-1"
                    style={{
                      background: 'radial-gradient(ellipse at center, rgba(255,255,255,0.45) 0%, rgba(220,220,220,0.18) 55%, rgba(0,0,0,0.3) 95%)',
                      boxShadow: '0 24px 38px rgba(0,0,0,0.38), inset 0 2px 4px rgba(255,255,255,0.8)'
                    }}
                  />
                  {/* Cylinder Body */}
                  <div
                    className="absolute bottom-14 w-[230px] lg:w-[280px] h-[150px] lg:h-[180px] rounded-b-[115px]/[48px] lg:rounded-b-[140px]/[55px] border-x-2 border-b-[3px] border-white/60 z-2 overflow-hidden flex justify-center"
                    style={{
                      background: 'linear-gradient(90deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 18%, rgba(0,0,0,0.2) 50%, rgba(255,255,255,0.15) 82%, rgba(255,255,255,0.45) 100%)'
                    }}
                  >
                    <div
                      className="absolute bottom-2 w-[218px] lg:w-[264px] h-[136px] lg:h-[162px] rounded-b-[109px]/[42px] lg:rounded-b-[132px]/[48px]"
                      style={{
                        backgroundColor: mixedHex,
                        boxShadow: 'inset 0 -18px 30px rgba(0,0,0,0.7), inset 0 10px 25px rgba(0,0,0,0.45)'
                      }}
                    />
                  </div>
                  {/* Top Meniscus */}
                  <div
                    className="absolute top-12 lg:top-14 w-[230px] lg:w-[280px] h-[95px] lg:h-[112px] rounded-full border-[3px] border-white/80 z-3 overflow-hidden"
                    style={{
                      backgroundColor: mixedHex,
                      boxShadow: 'inset 0 8px 18px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.3)'
                    }}
                  >
                    <div
                      className="absolute top-2 left-6 w-[70%] h-[45%] rounded-full pointer-events-none transform -rotate-14"
                      style={{
                        background: 'linear-gradient(180deg, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.05) 85%, transparent 100%)'
                      }}
                    />
                  </div>
                </div>
              )}

              {cameraView === 'top' && (
                <div
                  className="w-[240px] lg:w-[290px] h-[240px] lg:h-[290px] rounded-full border-[12px] border-white/70 shadow-2xl relative overflow-hidden"
                  style={{
                    backgroundColor: mixedHex,
                    boxShadow: '0 20px 40px rgba(0,0,0,0.4), inset 0 0 40px rgba(0,0,0,0.65)'
                  }}
                >
                  <div className="absolute top-[12%] left-[12%] w-[75%] h-[50%] rounded-full bg-white/40 transform -rotate-25 pointer-events-none" />
                </div>
              )}

              {cameraView === 'ink' && (
                <div
                  className="w-[240px] lg:w-[290px] h-[240px] lg:h-[290px] rounded-2xl shadow-2xl border-4 border-white/50 relative overflow-hidden flex items-center justify-center"
                  style={{ backgroundColor: mixedHex }}
                >
                  <div className="ink-swirl-wave" />
                  <span className="text-[10px] font-mono font-black text-white px-2.5 py-1 rounded bg-black/40 backdrop-blur-xs z-10">
                    Macro Liquid Core
                  </span>
                </div>
              )}

              {/* Floating Info Button ( i ) */}
              <button
                type="button"
                onClick={() => setIsCapInfoOpen(true)}
                className="absolute bottom-2 right-2 md:bottom-4 md:right-4 w-12 h-12 rounded-full border-2 border-black bg-[#f6c300] hover:bg-[#fad02c] active:scale-95 text-black flex items-center justify-center shadow-lg cursor-pointer z-20"
                title="Cap Info & Recipe Details"
              >
                <span className="font-serif font-black italic text-xl">i</span>
              </button>
            </div>

            {/* --- RIGHT COLUMN: ALL 3 INK CHANNELS VISIBLE TOGETHER --- */}
            <div className="w-full md:w-[260px] lg:w-[290px] flex flex-row md:flex-col justify-around md:justify-center gap-2 md:gap-4 shrink-0 z-10">
              {channels.map((chan, idx) => (
                <div
                  key={chan.id}
                  className="flex-1 md:flex-initial flex flex-col gap-1 p-2 rounded-2xl bg-black/5 dark:bg-white/5 border border-[var(--panel-border)]"
                >
                  <div className="flex flex-col md:flex-row items-center justify-between gap-2 px-1">
                    {/* Glossy 3D Liquid Sphere */}
                    <div
                      onClick={() => { setSelectedChanIdx(idx); setIsInkSelectorOpen(true); }}
                      className="glossy-sphere relative cursor-pointer"
                      style={{ backgroundColor: chan.ink.hex }}
                      title={`Click to change ink: ${chan.ink.name}`}
                    >
                      <div className="sphere-highlight" />
                      <div className="sphere-rim-light" />
                    </div>

                    {/* Smooth Vertical Slider */}
                    <VerticalSlider
                      value={chan.percentage}
                      onChange={(newVal) => handleSliderChange(idx, newVal)}
                      height={70}
                      ariaLabel={`${chan.ink.name} percentage`}
                    />
                  </div>

                  {/* Ink Label */}
                  <div
                    onClick={() => { setSelectedChanIdx(idx); setIsInkSelectorOpen(true); }}
                    className="text-[10px] md:text-xs font-black tracking-tight truncate cursor-pointer hover:underline text-center md:text-left pl-1"
                  >
                    {chan.ink.name} ({chan.ink.code}) - {chan.percentage}%
                  </div>
                </div>
              ))}
            </div>

          </main>

          {/* ========================================================================= */}
          {/* BOTTOM DOCK NAVIGATION: Reference, Mixer, Tray Opti, Archive, Settings     */}
          {/* ========================================================================= */}
          <nav className="h-14 border-t border-[var(--panel-border)] flex items-center justify-around shrink-0 px-4 md:px-12 z-30">
            <button
              onClick={() => showToast('Reference Tool Active')}
              className="flex flex-col items-center justify-center gap-1 opacity-70 hover:opacity-100 py-1 px-3 cursor-pointer"
            >
              <span className="text-base">🎨</span>
              <span className="text-[10px] font-bold">Reference</span>
            </button>

            <button
              onClick={() => setActiveTab('mixer')}
              className="flex flex-col items-center justify-center gap-1 font-black opacity-100 py-1 px-3 cursor-pointer relative"
            >
              <span className="text-base">💧</span>
              <span className="text-[10px]">Mixer</span>
              <div className="absolute -top-1 w-10 h-0.5 bg-[var(--text-main)] rounded-full" />
            </button>

            <button
              onClick={() => showToast('Tray Optimizer')}
              className="flex flex-col items-center justify-center gap-1 opacity-70 hover:opacity-100 py-1 px-3 cursor-pointer"
            >
              <span className="text-base">▦</span>
              <span className="text-[10px] font-bold">Tray Opti</span>
            </button>

            <button
              onClick={() => showToast('Recipe Archive')}
              className="flex flex-col items-center justify-center gap-1 opacity-70 hover:opacity-100 py-1 px-3 cursor-pointer"
            >
              <span className="text-base">📁</span>
              <span className="text-[10px] font-bold">Archive</span>
            </button>

            <button
              onClick={() => showToast('Settings & Calibration')}
              className="flex flex-col items-center justify-center gap-1 opacity-70 hover:opacity-100 py-1 px-3 cursor-pointer"
            >
              <span className="text-base">⚙️</span>
              <span className="text-[10px] font-bold">Settings</span>
            </button>
          </nav>

          {/* ========================================================================= */}
          {/* INK SELECTOR MODAL                                                        */}
          {/* ========================================================================= */}
          {isInkSelectorOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-[var(--bg-canvas)] border-2 border-[var(--text-main)] rounded-2xl max-w-sm w-full p-4 shadow-2xl">
                <div className="flex justify-between items-center mb-3">
                  <h3 className="font-stencil font-black text-lg">SELECT PIGMENT</h3>
                  <button onClick={() => setIsInkSelectorOpen(false)} className="text-sm font-black p-1">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto">
                  {INK_PALETTE.map(ink => (
                    <button
                      key={ink.id}
                      onClick={() => {
                        setChannels(prev => prev.map((ch, i) => i === selectedChanIdx ? { ...ch, ink } : ch));
                        setIsInkSelectorOpen(false);
                      }}
                      className="flex items-center gap-2 p-2 rounded-xl bg-black/5 hover:bg-black/15 text-left border border-black/20"
                    >
                      <div className="w-6 h-6 rounded-full border border-black/40 shadow-xs" style={{ backgroundColor: ink.hex }} />
                      <div className="overflow-hidden">
                        <div className="text-xs font-black truncate">{ink.name}</div>
                        <div className="text-[9px] opacity-75 font-mono">{ink.code}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* CAP INFO & DROP BREAKDOWN MODAL                                           */}
          {/* ========================================================================= */}
          {isCapInfoOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-[var(--bg-canvas)] border-2 border-[var(--text-main)] rounded-2xl max-w-sm w-full p-5 shadow-2xl">
                <div className="flex justify-between items-center mb-3 border-b border-black/20 pb-2">
                  <div>
                    <h3 className="font-stencil font-black text-lg">CAP DISPENSING GUIDE</h3>
                    <p className="text-[10px] font-bold uppercase opacity-80">{capSize.toUpperCase()} CAP (30 DROPS TOTAL)</p>
                  </div>
                  <button onClick={() => setIsCapInfoOpen(false)} className="text-sm font-black p-1">✕</button>
                </div>
                
                <div className="flex flex-col gap-2 my-4">
                  {channels.map((ch, idx) => {
                    const drops = Math.round((ch.percentage / 100) * 30);
                    return (
                      <div key={ch.id} className="flex items-center justify-between p-2 rounded-xl bg-black/5 border border-black/15">
                        <div className="flex items-center gap-2">
                          <div className="w-5 h-5 rounded-full border border-black/30" style={{ backgroundColor: ch.ink.hex }} />
                          <span className="text-xs font-black">{ch.ink.name}</span>
                        </div>
                        <span className="text-xs font-mono font-black">{drops} drops ({ch.percentage}%)</span>
                      </div>
                    );
                  })}
                </div>

                <div className="flex items-center justify-between text-xs font-black pt-2 border-t border-black/20">
                  <span>Delta · E Match:</span>
                  <span className="font-mono">{deltaE}</span>
                </div>

                <button
                  onClick={() => setIsCapInfoOpen(false)}
                  className="w-full mt-4 py-2 rounded-xl bg-black text-white font-black text-xs uppercase"
                >
                  Close
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
